services:
  postgres:
    image: postgres:17
    container_name: auxiliar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auxiliar
      POSTGRES_USER: auxiliar
      POSTGRES_PASSWORD: auxiliar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
    container_name: auxiliar-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auxiliar
      SPRING_DATASOURCE_USERNAME: auxiliar
      SPRING_DATASOURCE_PASSWORD: auxiliar
      # Auxi's chat: taken from the shell or a .env next to this file (see server/.env.example)
      AI_PROVIDER: ${AI_PROVIDER:-nvidia}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      AI_REASONING: ${AI_REASONING:-false}
    depends_on:
      - postgres

volumes:
  postgres_data: