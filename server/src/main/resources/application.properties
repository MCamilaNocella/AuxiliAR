spring.application.name=server
# Railway (and other hosts) set PORT; 8080 locally
server.port=${PORT:8080}

# Database: local docker-compose values by default; in Railway, set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
spring.datasource.url=jdbc:postgresql://postgres:5432/auxiliar
spring.datasource.username=auxiliar
spring.datasource.password=auxiliar

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
