spring.application.name=server
# Local secrets (OPENROUTER_API_KEY...) in server/.env, never committed
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://postgres:5432/auxiliar
spring.datasource.username=auxiliar
spring.datasource.password=auxiliar

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Auxi's chat: the model provider (both have an OpenAI-compatible API), picked with AI_PROVIDER = nvidia | openrouter
auxiliar.ai.provider=${AI_PROVIDER:nvidia}
# NVIDIA (build.nvidia.com, free API key)
auxiliar.ai.nvidia.base-url=https://integrate.api.nvidia.com/v1
auxiliar.ai.nvidia.api-key=${NVIDIA_API_KEY:}
auxiliar.ai.nvidia.model=${NVIDIA_MODEL:nvidia/nemotron-3-super-120b-a12b}
# OpenRouter (openrouter.ai)
auxiliar.ai.openrouter.base-url=https://openrouter.ai/api/v1
auxiliar.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
auxiliar.ai.openrouter.model=${OPENROUTER_MODEL:nvidia/nemotron-3-super-120b-a12b:free}
# The chosen provider's settings go to Spring AI's OpenAI client
spring.ai.openai.base-url=${auxiliar.ai.${auxiliar.ai.provider}.base-url}
spring.ai.openai.api-key=${auxiliar.ai.${auxiliar.ai.provider}.api-key}
spring.ai.openai.chat.model=${auxiliar.ai.${auxiliar.ai.provider}.model}
spring.ai.openai.chat.temperature=0.4
# Let the model "think" before the answer: better answers, but 15 to 60 s slower
auxiliar.chat.reasoning=${AI_REASONING:false}
# Only the chat model is used (no embeddings, images, audio or moderation yet)
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# Origins allowed to call /api (Vite dev server and the published site)
auxiliar.cors.allowed-origins=${AUXILIAR_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://auxiliar.estudy.ar}
