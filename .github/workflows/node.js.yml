# Builds the client on every push / PR to main, and publishes it to GitHub Pages (auxiliar.estudy.ar) on push to main

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push doesn't cancel one already publishing
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
    - uses: actions/checkout@v4
    # Vite 8 needs Node 20.19+ / 22.12+
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: client/package-lock.json
    - run: npm ci
    - run: npm run lint
    - run: npm run build
    # GitHub Pages has no SPA rewrites: serve the app for unknown paths too (e.g. /auxi-modelos on reload)
    - run: cp dist/index.html dist/404.html
    - uses: actions/upload-pages-artifact@v3
      with:
        path: client/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
